name: APK local gratuit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-local-build
  cancel-in-progress: false

jobs:
  build-apk:
    name: Construire APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances Android
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Installer les dépendances JavaScript
        run: npm ci

      - name: Vérifier TypeScript
        run: npm run typecheck

      - name: Générer le projet Android natif
        run: npx expo prebuild --platform android --no-install

      - name: Construire l'APK release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Vérifier que l'APK existe
        run: test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: AfriVibe-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publier une release GitHub téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-local-${{ github.run_number }}
          name: AfriVibe APK - build ${{ github.run_number }}
          body: |
            APK Android généré par GitHub Actions pour test.
            Cette version est signée avec la clé de débogage et n'est pas destinée à une publication Play Store.
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: false

name: APK local gratuit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: apk-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Construire APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remplacer les clips abstraits par des séquences vidéo CC0
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p assets/videos
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 'https://commons.wikimedia.org/wiki/Special:FilePath/Sc%C3%A8nes_de_rue%2C_march%C3%A9%2C_for%C3%AAt_d%C3%A9vast%C3%A9e_-_AI140403.webm' -o /tmp/afrivibe-demo-source.webm
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/afrivibe-demo-source.webm
          for i in 1 2 3 4 5 6; do
            start=$(( (i - 1) * 10 ))
            ffmpeg -hide_banner -loglevel error -ss "$start" -i /tmp/afrivibe-demo-source.webm -t 5 -an -vf 'scale=480:854:force_original_aspect_ratio=increase,crop=480:854,fps=24,format=yuv420p' -c:v libx264 -preset veryfast -crf 27 -movflags +faststart -y "assets/videos/vibe-$i.mp4"
            ffmpeg -hide_banner -loglevel error -ss "$((start + 1))" -i /tmp/afrivibe-demo-source.webm -frames:v 1 -vf 'scale=480:854:force_original_aspect_ratio=increase,crop=480:854' -q:v 5 -y "assets/videos/vibe-$i-poster.jpg"
          done
          test -s assets/videos/vibe-1.mp4
          test -s assets/videos/vibe-6-poster.jpg

      - name: Installer les dépendances JavaScript
        run: npm ci

      - name: Vérifier TypeScript
        run: npm run typecheck

      - name: Générer le projet Android natif
        run: npx expo prebuild --platform android --no-install

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties

      - name: Construire l'APK release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Vérifier le package Android et l'APK
        run: |
          grep -q 'com.afrivibe.app' android/app/build.gradle
          test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Publier l'APK comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: AfriVibe-${{ github.sha }}-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
